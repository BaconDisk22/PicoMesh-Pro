name: Source-level regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record tested commit
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Event: $GITHUB_EVENT_NAME"
          python --version
      - name: Run source-level regression checks
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee source-test-results.txt
      - name: Upload source test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-test-results
          path: source-test-results.txt
          if-no-files-found: warn
          retention-days: 14
